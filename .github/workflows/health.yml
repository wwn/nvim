# ============================================================================
#  nvim-health — prüft, ob diese Neovim-Config auf einer frischen Maschine
#  sauber startet und :checkhealth fehlerfrei durchläuft.
#
#  Ablauf je Betriebssystem:
#    1. Neovim (stable) installieren
#    2. externe Tools installieren (git/ripgrep/fd — Telescope braucht sie)
#    3. Config nach $XDG_CONFIG_HOME/nvim auschecken
#    4. Erster Start: vim.pack.add() klont alle Plugins aus dem Lockfile
#    5. Zweiter Start: darf nichts mehr auf stderr schreiben
#    6. .github/ci/health.lua: Lockfile-Abgleich, Module, Tools, :checkhealth
#
#  Rot wird der Lauf nur bei ERROR. WARNINGs (fehlendes `trash`, abweichende
#  Plugin-Revision …) stehen in der Job-Summary und im Artefakt.
# ============================================================================
name: nvim-health

on:
  # "**" statt "*", damit auch mehrstufige Namen wie feature/main/xyz greifen.
  # Ein Pull Request braucht keinen eigenen Trigger: Checks hängen am Commit,
  # der Push-Lauf desselben SHA taucht also im PR auf. "pull_request:" wäre
  # hier nur ein zweiter Lauf pro Commit — wieder einschalten, falls einmal
  # PRs aus Forks oder aus anders benannten Branches kommen sollen (dann
  # prüft der PR-Lauf zusätzlich den Merge-Stand gegen main).
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "chore/**"
  # Montags früh: fängt Upstream-Plugin-Updates, die die Config brechen,
  # bevor man selbst in ein kaputtes nvim läuft.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Auf "v0.12.5" o.ä. pinnen, falls "stable" mal vorauseilt.
  NVIM_VERSION: stable

jobs:
  health:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # Neovim beachtet die XDG-Variablen auch unter Windows. Damit liegt die
      # Config im Workspace statt in ~/.config bzw. %LOCALAPPDATA%.
      XDG_CONFIG_HOME: ${{ github.workspace }}/xdg/config
      XDG_DATA_HOME: ${{ github.workspace }}/xdg/data
      XDG_STATE_HOME: ${{ github.workspace }}/xdg/state
      XDG_CACHE_HOME: ${{ github.workspace }}/xdg/cache
      # In einem run:-Step ist $TERM nicht gesetzt. Der Terminal-Abschnitt von
      # :checkhealth ruft dann "infocmp -L" auf, das mit "environment variable
      # TERM not set" abbricht und als ERROR gemeldet wird — eine Eigenheit des
      # Runners, nicht der Config. xterm-256color liegt in ncurses-base und ist
      # auf den Images vorhanden.
      TERM: xterm-256color

    steps:
      - name: Config auschecken
        uses: actions/checkout@v4
        with:
          path: xdg/config/nvim

      - name: Neovim installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/nvim.tar.gz"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Neovim installieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/neovim/neovim/releases/download/$env:NVIM_VERSION/nvim-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\nvim.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nvim.zip" -DestinationPath "$env:RUNNER_TEMP\nvim" -Force
          "$env:RUNNER_TEMP\nvim\nvim-win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: ripgrep und fd installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep fd-find
          # Debian nennt das Binary "fdfind"; Telescope sucht zuerst nach "fd".
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: ripgrep und fd installieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep fd -y --no-progress

      - name: Versionen
        run: |
          nvim --version | sed -n "1,3p"
          git --version
          rg --version | sed -n "1p"
          fd --version
          # Diagnose: läuft das nicht durch, meldet der Terminal-Abschnitt von
          # :checkhealth später einen ERROR.
          infocmp -L | sed -n "1p" || echo "infocmp fehlgeschlagen (TERM=$TERM)"

      # Erster Start: vim.pack.add() klont hier alle Plugins. Die Ausgabe darf
      # laut sein — geprüft wird erst der zweite Start.
      - name: Plugins installieren (erster Start)
        run: nvim --headless "+qa!"

      - name: Startvorgang ohne Fehler
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          nvim --headless "+qa!" 2> "$RUNNER_TEMP/logs/startup.log"
          status=$?
          echo "--- stderr des Starts ---"
          cat "$RUNNER_TEMP/logs/startup.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::nvim ist mit Exitcode $status beendet worden"
            exit 1
          fi
          # E123-Meldungen, Lua-Tracebacks und "Error executing…" abfangen.
          if grep -qiE "^E[0-9]+:|stack traceback|Error executing|error detected" \
              "$RUNNER_TEMP/logs/startup.log"; then
            echo "::error::Fehlerausgabe beim Start von Neovim"
            exit 1
          fi

      - name: Startzeit messen
        run: |
          set -euo pipefail
          nvim --headless --startuptime "$RUNNER_TEMP/logs/startuptime.log" "+qa!"
          # Die Gesamtzeit steht in der Zeile "--- NVIM STARTED ---"; danach
          # folgt noch eine Leerzeile, "tail -1" greift also daneben.
          total=$(awk '/NVIM STARTED/ { t = $1 } END { print t }' \
            "$RUNNER_TEMP/logs/startuptime.log")
          echo "Startzeit: ${total} ms"
          echo "Startzeit (${{ matrix.os }}): **${total} ms**" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup- und Health-Check
        env:
          # Absolute Pfade nötig: user.main wechselt beim Start nach ~.
          CI_SCRIPT: ${{ github.workspace }}/xdg/config/nvim/.github/ci/health.lua
          CI_REPORT: ${{ github.workspace }}/health-report/${{ matrix.os }}.txt
        run: nvim --headless -c "lua dofile(vim.env.CI_SCRIPT)"

      # Der normale Lauf installiert exakt die Commits aus dem Lockfile und
      # merkt deshalb nichts von kaputten Upstream-Updates. Im geplanten Lauf
      # wird darum einmal zusätzlich auf die neuesten Commits aktualisiert.
      # continue-on-error: ein defektes Plugin-Update ist ein Hinweis, kein
      # Grund, den Lauf der eigenen Config rot zu machen.
      - name: Plugin-Updates testen (nur geplanter Lauf)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CI_SCRIPT: ${{ github.workspace }}/xdg/config/nvim/.github/ci/health.lua
          CI_REPORT: ${{ github.workspace }}/health-report/${{ matrix.os }}-updated.txt
        run: |
          set -euo pipefail
          nvim --headless -c "lua vim.pack.update(nil, { force = true })" -c "qa!"
          echo "### Lockfile nach vim.pack.update()" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git -C "$XDG_CONFIG_HOME/nvim" --no-pager diff -- nvim-pack-lock.json \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          nvim --headless -c "lua dofile(vim.env.CI_SCRIPT)"

      - name: Health-Report als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ matrix.os }}
          path: |
            health-report/
          if-no-files-found: warn
          retention-days: 14
